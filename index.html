<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAINWISE AI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
        .card-dark { background-color: #0c0f17; border: 1px solid #1a202c; }
        .tiffany-text { color: #0aadc7; }
        .tiffany-bg { background-color: #0aadc7; }
        .active-tab { color: #0aadc7; font-weight: 900; }
        * { -webkit-tap-highlight-color: transparent; }
        .scroll-container { overflow-y: auto; height: calc(100vh - 140px); padding-bottom: 60px; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative bg-black select-none">

    <header class="fixed top-0 left-0 right-0 max-w-md mx-auto bg-black/90 backdrop-blur-md z-50 px-5 pt-4 pb-3 flex justify-between items-center border-b border-gray-900/60">
        <div>
            <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-[#0aadc7] to-[#81e6d9]">TRAINWISE AI</h1>
            <p class="text-[9px] text-gray-500 font-mono mt-0.5">PREMIUM WORKOUT ARCHITECT</p>
        </div>
        <button onclick="switchTab('chat')" class="w-10 h-10 rounded-full border border-[#0aadc7]/40 bg-gradient-to-tr from-[#0c0f17] to-[#121c2c] flex items-center justify-center shadow-lg active:scale-90 transition-all">
            <span class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-[#0aadc7] to-[#bd00ff]">✦</span>
        </button>
    </header>

    <main class="flex-1 mt-[72px] px-5 scroll-container">

        <section class="mb-6 pt-2 bg-[#0c0f17]/40 p-4 rounded-2xl border border-gray-900">
            <div class="flex justify-between items-center mb-3 px-1">
                <button onclick="changeMonth(-1)" class="text-[#0aadc7] font-black p-1">◀</button>
                <span id="calendar-month-title" class="text-xs font-bold font-mono tracking-wider">2026年 5月</span>
                <button onclick="changeMonth(1)" class="text-[#0aadc7] font-black p-1">▶</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-gray-600 uppercase mb-1">
                <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
            </div>
            <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-center font-mono text-xs">
                </div>
        </section>

        <div id="content-dash" class="space-y-6">
            
            <div class="space-y-3 bg-[#0c0f17]/80 p-4 rounded-2xl border border-gray-900">
                <div class="flex flex-col space-y-2">
                    <span class="text-gray-500 text-[11px] font-bold uppercase tracking-wider">部位フィルター:</span>
                    <div class="flex flex-wrap gap-1" id="part-filters">
                        <button onclick="updateCharts('ALL')" id="f-part-ALL" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-[#0aadc7] text-black">ALL</button>
                        <button onclick="updateCharts('胸')" id="f-part-胸" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">胸</button>
                        <button onclick="updateCharts('脚')" id="f-part-脚" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">脚</button>
                        <button onclick="updateCharts('背中')" id="f-part-背中" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">背中</button>
                        <button onclick="updateCharts('腕')" id="f-part-腕" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">腕</button>
                        <button onclick="updateCharts('肩')" id="f-part-肩" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">肩</button>
                        <button onclick="updateCharts('お尻')" id="f-part-お尻" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">お尻</button>
                        <button onclick="updateCharts('腹筋')" id="f-part-腹筋" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400">腹筋</button>
                    </div>
                </div>
                <div class="flex items-center justify-between border-t border-gray-900 pt-2">
                    <span class="text-gray-500 text-[11px] font-bold uppercase tracking-wider">表示期間:</span>
                    <div class="flex space-x-1" id="period-filters">
                        <button onclick="updatePeriod('ALL')" id="f-per-ALL" class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-[#0aadc7] text-black">ALL</button>
                        <button onclick="updatePeriod('6M')" id="f-per-6M" class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-black text-gray-400">6ヶ月</button>
                        <button onclick="updatePeriod('3M')" id="f-per-3M" class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-black text-gray-400">3ヶ月</button>
                        <button onclick="updatePeriod('1M')" id="f-per-1M" class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-black text-gray-400">1ヶ月</button>
                    </div>
                </div>
            </div>

            <div class="card-dark p-5 rounded-2xl">
                <h3 class="text-xs font-bold text-gray-400 tracking-wide uppercase mb-3" id="vol-graph-title">VOLUME TREND</h3>
                <div class="h-44 w-full"><canvas id="volumeChart"></canvas></div>
            </div>

            <div class="card-dark p-5 rounded-2xl">
                <h3 class="text-xs font-bold text-gray-400 tracking-wide uppercase mb-3" id="rm-graph-title">ESTIMATED 1RM TREND</h3>
                <div class="h-44 w-full"><canvas id="rmChart"></canvas></div>
            </div>

            <div class="card-dark p-5 rounded-2xl">
                <h3 class="text-xs font-bold text-gray-400 tracking-wide uppercase mb-3">📋 過去のトレーニングログ（修正・削除）</h3>
                <div id="log-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    </div>
            </div>
        </div>

        <div id="content-log" class="hidden space-y-6">
            <div class="card-dark p-5 rounded-2xl space-y-5">
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">1. 対象部位</label>
                    <div class="grid grid-cols-4 gap-1.5" id="category-selector-grid">
                        </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">2. ワークアウト種目</label>
                    <select id="log-exercise" onchange="updatePreviousStats()" class="w-full bg-black border border-gray-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-[#0aadc7] font-bold"></select>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-black p-3 rounded-xl border border-gray-900 text-center">
                    <div>
                        <span class="block text-[10px] text-gray-500 font-bold mb-0.5">◀ 前回実績</span>
                        <span id="stat-prev" class="text-xs font-mono font-bold text-[#0aadc7]">データなし</span>
                    </div>
                    <div class="border-l border-gray-900">
                        <span class="block text-[10px] text-gray-500 font-bold mb-0.5">◀◀ 前々回実績</span>
                        <span id="stat-prev2" class="text-xs font-mono font-bold text-gray-400">データなし</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="grid grid-cols-3 gap-2 text-center text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                        <div>セット</div><div>重量 (kg)</div><div>回数 (レップ数入力)</div>
                    </div>
                    <div id="set-inputs-container" class="space-y-2">
                        </div>
                    <button onclick="addNewSetRow()" class="w-full py-2 bg-gray-950 border border-dashed border-gray-800 rounded-xl text-xs text-[#0aadc7] font-bold mt-1">
                        ＋ セットを追加 (第6セット以降)
                    </button>
                </div>

                <button onclick="saveLog()" id="btn-save-workout" class="w-full bg-[#0aadc7] hover:bg-[#099cb3] text-black font-black py-4 rounded-xl text-sm shadow-xl shadow-[#0aadc7]/10 transition-all active:scale-[0.98]">
                    RECORD WORKOUT SESSION
                </button>
            </div>
        </div>

        <div id="content-chat" class="hidden flex flex-col h-[60vh] justify-between">
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 p-1 text-xs pr-2">
                <div class="bg-[#0c0f17] border border-[#0aadc7]/20 p-3.5 rounded-2xl rounded-tl-none max-w-[88%]">
                    <span class="font-black text-[#0aadc7] block mb-1">AI Coach Agent</span>
                    最新の7部位セグメントデータ、および過去のログ修正データをインテリジェントに同期しました。
                    現在のトレーニングボリュームと停滞打開策について、何でも相談してください。
                </div>
            </div>
            <div class="flex space-x-2 mt-4 bg-[#0c0f17] p-2 rounded-xl border border-gray-900">
                <input type="text" id="chat-input" placeholder="AIトレーナーに相談..." class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none font-medium">
                <button onclick="sendMessage()" class="bg-[#0aadc7] text-black px-4 py-2 rounded-lg font-black text-xs active:scale-95 transition-all">ASK</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 border-t border-gray-950 max-w-md mx-auto backdrop-blur-md flex justify-around items-center h-16 text-center z-50">
        <button onclick="switchTab('dash')" id="nav-dash" class="flex-1 h-full flex flex-col justify-center items-center text-xs font-bold active-tab">
            <span class="text-base mb-0.5">📊</span><span>ダッシュボード</span>
        </button>
        <button onclick="switchTab('log')" id="nav-log" class="flex-1 h-full flex flex-col justify-center items-center text-xs font-bold text-gray-600">
            <span class="text-base mb-0.5">🏋️‍♂️</span><span>記録入力</span>
        </button>
        <button onclick="switchTab('chat')" id="nav-chat" class="flex-1 h-full flex flex-col justify-center items-center text-xs font-bold text-gray-600">
            <span class="text-base mb-0.5">🧠</span><span>AIエージェント</span>
        </button>
    </nav>

    <script>
        // 1. 7部位マスターデータの定義
        const exerciseMaster = {
            '胸': ['ベンチプレス', 'インクラインダンベルプレス', 'チェストフライ'],
            '背中': ['デッドリフト', 'ラットプルダウン', 'ベントオーバーロウ'],
            '脚': ['スクワット', 'レッグプレス', 'ブルガリアンスクワット'],
            '腕': ['バーベルカール', 'ライイングトリセプスエクテンション', 'ハンマーカール'],
            '肩': ['ショルダープレス', 'サイドレイズ', 'リアレイズ'],
            'お尻': ['ヒップスラスト', 'バックエクステンション'],
            '腹筋': ['クランチ', 'レッグレイズ', 'アブローラー']
        };

        let currentCategory = '胸';
        let currentFilterPart = 'ALL';
        let currentFilterPeriod = 'ALL';
        let activeEditIndex = null; // 修正モード用フラグ

        // カレンダー用状態管理 (2026年5月基準)
        let calendarYear = 2026;
        let calendarMonth = 4; // 0始まりなので5月

        // 標準表示セットカウント
        let currentSetCount = 5;

        // 2. データベースの初期化と完全復元
        let appData = JSON.parse(localStorage.getItem('trainwise_v6_final')) || {
            logs: [
                { id: 1, date: '2026-05-22', part: '胸', exercise: 'ベンチプレス', sets: [{w:90, r:5}, {w:80, r:7}, {w:70, r:8}] },
                { id: 2, date: '2026-05-24', part: '胸', exercise: 'ベンチプレス', sets: [{w:95, r:5}, {w:85, r:6}, {w:75, r:7}] },
                { id: 3, date: '2026-05-26', part: '胸', exercise: 'ベンチプレス', sets: [{w:95, r:5}, {w:85, r:6}, {w:75, r:7}] },
                { id: 4, date: '2026-05-28', part: '胸', exercise: 'ベンチプレス', sets: [{w:95, r:5}, {w:85, r:6}, {w:75, r:7}] },
                { id: 5, date: '2026-05-25', part: '脚', exercise: 'スクワット', sets: [{w:120, r:5}, {w:110, r:6}] }
            ]
        };

        // タブ制御
        function switchTab(tab) {
            ['dash', 'log', 'chat'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex-1 h-full flex flex-col justify-center items-center text-xs font-bold text-gray-600";
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex-1 h-full flex flex-col justify-center items-center text-xs font-bold active-tab";
            if(tab === 'dash') { renderLogList(); updateCharts(currentFilterPart); }
        }

        // 3. 1ヶ月表示カレンダー生成エンジン
        function renderCalendar() {
            const grid = document.getElementById('calendar-days-grid');
            grid.innerHTML = '';
            document.getElementById('calendar-month-title').innerText = `${calendarYear}年 ${calendarMonth + 1}月`;

            const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
            const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

            // 空白埋め
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="p-1.5 opacity-0"></div>`;
            }

            // 日付描写
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasWorkout = appData.logs.some(l => l.date === dateStr);
                const isToday = new Date().getDate() === day && new Date().getMonth() === calendarMonth && new Date().getFullYear() === calendarYear;

                let cellClass = "p-1.5 rounded-lg flex flex-col items-center justify-center text-gray-500";
                if (isToday) cellClass = "p-1.5 rounded-lg bg-[#0aadc7]/10 border border-[#0aadc7]/40 text-[#81e6d9] font-black";
                else if (hasWorkout) cellClass = "p-1.5 rounded-lg text-white font-bold";

                grid.innerHTML += `
                    <div class="${cellClass}">
                        <span>${day}</span>
                        <span class="text-[8px] mt-0.5 ${hasWorkout ? 'text-[#0aadc7]' : 'text-transparent'}">●</span>
                    </div>
                `;
            }
        }

        function changeMonth(dir) {
            calendarMonth += dir;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            renderCalendar();
        }

        // 4. 記録入力側：7部位・動的セット生成ロジック
        function renderCategorySelector() {
            const container = document.getElementById('category-selector-grid');
            container.innerHTML = '';
            Object.keys(exerciseMaster).forEach(cat => {
                const isActive = cat === currentCategory;
                container.innerHTML += `
                    <button onclick="selectCategory('${cat}')" class="py-2 rounded-xl text-[11px] font-bold ${isActive ? 'bg-[#0aadc7] text-black' : 'bg-gray-900 text-gray-400'} border border-transparent">${cat}</button>
                `;
            });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategorySelector();
            const select = document.getElementById('log-exercise');
            select.innerHTML = '';
            exerciseMaster[cat].forEach(ex => {
                select.innerHTML += `<option value="${ex}">${ex}</option>`;
            });
            updatePreviousStats();
        }

        function renderSetInputs() {
            const container = document.getElementById('set-inputs-container');
            container.innerHTML = '';
            for (let i = 1; i <= currentSetCount; i++) {
                container.innerHTML += `
                    <div class="grid grid-cols-3 gap-2 items-center bg-black/40 p-2 rounded-xl border border-gray-900">
                        <div class="text-xs font-black text-gray-500 pl-2">SET {index}</div>
                        <input type="number" id="weight-{index}" placeholder="kg" class="bg-[#121212] border border-gray-800 rounded-lg p-2 text-sm text-center font-mono text-white focus:outline-none focus:border-[#0aadc7]">
                        <input type="number" id="rep-{index}" placeholder="reps" class="bg-[#121212] border border-gray-800 rounded-lg p-2 text-sm text-center font-mono text-white focus:outline-none focus:border-[#0aadc7]">
                    </div>
                `.replace(/{index}/g, i);
            }
        }

        function addNewSetRow() {
            currentSetCount++;
            renderSetInputs();
        }

        // 直近2回の実績算出
        function updatePreviousStats() {
            const exercise = document.getElementById('log-exercise').value;
            const filtered = appData.logs.filter(l => l.exercise === exercise).sort((a,b) => new Date(b.date) - new Date(a.date));
            
            document.getElementById('stat-prev').innerText = filtered[0] ? `${filtered[0].sets[0].w}kg / ${filtered[0].sets[0].r}r` : 'データなし';
            document.getElementById('stat-prev2').innerText = filtered[1] ? `${filtered[1].sets[0].w}kg / ${filtered[1].sets[0].r}r` : 'データなし';
        }

        // 5. データ保存・修正・削除コアエンジン
        function saveLog() {
            const exercise = document.getElementById('log-exercise').value;
            let setsData = [];

            for (let i = 1; i <= currentSetCount; i++) {
                let w = parseFloat(document.getElementById(`weight-${i}`).value);
                let r = parseInt(document.getElementById(`rep-${i}`).value);
                if (w && r) setsData.push({ w: w, r: r });
            }

            if (setsData.length === 0) return alert('重量とレップ数を入力してください。');

            if (activeEditIndex !== null) {
                // 修正保存モード
                appData.logs[activeEditIndex].sets = setsData;
                appData.logs[activeEditIndex].exercise = exercise;
                appData.logs[activeEditIndex].part = currentCategory;
                activeEditIndex = null;
                document.getElementById('btn-save-workout').innerText = "RECORD WORKOUT SESSION";
                alert('トレーニング記録を修正しました！');
            } else {
                // 新規保存モード
                const todayStr = new Date().toISOString().split('T')[0];
                appData.logs.push({
                    id: Date.now(),
                    date: todayStr,
                    part: currentCategory,
                    exercise: exercise,
                    sets: setsData
                });
                alert('トレーニング記録を保存しました！');
            }

            localStorage.setItem('trainwise_v6_final', JSON.stringify(appData));
            currentSetCount = 5;
            renderSetInputs();
            renderCalendar();
            switchTab('dash');
        }

        // 過去ログリストの描画（修正・削除機能付き）
        function renderLogList() {
            const container = document.getElementById('log-list-container');
            container.innerHTML = '';
            
            const sortedLogs = [...appData.logs].sort((a,b) => new Date(b.date) - new Date(a.date));
            
            if(sortedLogs.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-600 text-center py-4">記録されたログがありません。</p>`;
                return;
            }

            sortedLogs.forEach(log => {
                let setSummary = log.sets.map((s, idx) => `${idx+1}枠:${s.w}kg×${s.r}`).join(' | ');
                let indexInMainData = appData.logs.findIndex(l => l.id === log.id);

                container.innerHTML += `
                    <div class="bg-black/40 p-3 rounded-xl border border-gray-900 flex justify-between items-center text-xs">
                        <div class="space-y-1 flex-1 pr-2">
                            <div class="flex items-center space-x-2">
                                <span class="font-mono text-gray-500 font-bold">${log.date}</span>
                                <span class="px-1.5 py-0.5 rounded bg-gray-900 text-[#0aadc7] text-[10px] font-black">${log.part}</span>
                                <span class="font-bold text-white">${log.exercise}</span>
                            </div>
                            <div class="text-[10px] text-gray-400 font-mono truncate">${setSummary}</div>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="startEditLog(${indexInMainData})" class="px-2 py-1 rounded bg-blue-950 text-blue-400 text-[10px] font-bold">修正</button>
                            <button onclick="deleteLog(${indexInMainData})" class="px-2 py-1 rounded bg-red-950 text-red-400 text-[10px] font-bold">削除</button>
                        </div>
                    </div>
                `;
            });
        }

        function startEditLog(index) {
            const log = appData.logs[index];
            activeEditIndex = index;
            
            switchTab('log');
            selectCategory(log.part);
            document.getElementById('log-exercise').value = log.exercise;
            
            currentSetCount = Math.max(5, log.sets.length);
            renderSetInputs();

            log.sets.forEach((set, i) => {
                document.getElementById(`weight-${i+1}`).value = set.w;
                document.getElementById(`rep-${i+1}`).value = set.r;
            });

            document.getElementById('btn-save-workout').innerText = "上記の修正内容で確定保存する";
        }

        function deleteLog(index) {
            if(!confirm('このセッションデータを本当に削除しますか？')) return;
            appData.logs.splice(index, 1);
            localStorage.setItem('trainwise_v6_final', JSON.stringify(appData));
            renderLogList();
            renderCalendar();
            updateCharts(currentFilterPart);
        }

        // 6. グラフ（フィルター・期間切り替え完全連動機能）
        let vChart, rChart;
        function initCharts() {
            let vCtx = document.getElementById('volumeChart').getContext('2d');
            vChart = new Chart(vCtx, {
                type: 'bar',
                data: { labels: [], datasets: [{ data: [], backgroundColor: '#00ffff', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#111' }, ticks: { color: '#444' } }, x: { ticks: { color: '#888' } } } }
            });

            let rCtx = document.getElementById('rmChart').getContext('2d');
            rChart = new Chart(rCtx, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], borderColor: '#ff007f', tension: 0.2, fill: false }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#111' }, ticks: { color: '#444' } }, x: { ticks: { color: '#888' } } } }
            });
            updateCharts('ALL');
        }

        function updatePeriod(period) {
            currentFilterPeriod = period;
            ['ALL', '6M', '3M', '1M'].forEach(p => {
                document.getElementById(`f-per-${p}`).className = p === period ? "px-2.5 py-0.5 rounded text-[10px] font-bold bg-[#0aadc7] text-black" : "px-2.5 py-0.5 rounded text-[10px] font-bold bg-black text-gray-400";
            });
            updateCharts(currentFilterPart);
        }

        function updateCharts(part) {
            currentFilterPart = part;
            Object.keys(exerciseMaster).concat(['ALL']).forEach(p => {
                const btn = document.getElementById(`f-part-${p}`);
                if(btn) btn.className = p === part ? "px-2.5 py-1 rounded-md text-[10px] font-bold bg-[#0aadc7] text-black" : "px-2.5 py-1 rounded-md text-[10px] font-bold bg-black text-gray-400";
            });

            // 期間フィルタリング用日付計算
            const now = new Date();
            let limitDate = new Date(0); // ALL
            if (currentFilterPeriod === '1M') limitDate = new Date(now.setMonth(now.getMonth() - 1));
            else if (currentFilterPeriod === '3M') limitDate = new Date(now.setMonth(now.getMonth() - 3));
            else if (currentFilterPeriod === '6M') limitDate = new Date(now.setMonth(now.getMonth() - 6));

            // フィルタデータの抽出
            let filteredLogs = appData.logs.filter(l => new Date(l.date) >= limitDate).sort((a,b) => new Date(a.date) - new Date(b.date));
            if (part !== 'ALL') filteredLogs = filteredLogs.filter(l => l.part === part);

            // ボリューム集計
            let volumeMap = {};
            let rmLabels = [];
            let rmValues = [];

            filteredLogs.forEach(log => {
                let logVol = log.sets.reduce((acc, s) => acc + (s.w * s.r), 0);
                volumeMap[log.date] = (volumeMap[log.date] || 0) + logVol;

                // 1RM算出（各日のMAX重量セットをベースに換算）
                let maxRM = Math.max(...log.sets.map(s => s.w * (1 + s.r / 40)));
                rmLabels.push(log.date.substring(5)); // 月-日表記
                rmValues.push(Math.round(maxRM));
            });

            // グラフ1（ボリューム）のデータ反映
            vChart.data.labels = Object.keys(volumeMap).map(d => d.substring(5));
            vChart.data.datasets[0].data = Object.values(volumeMap);
            vChart.data.datasets[0].backgroundColor = part === '胸' ? '#ff007f' : (part === '脚' ? '#00ffff' : '#bd00ff');
            vChart.update();

            // グラフ2（1RM）のデータ反映
            rChart.data.labels = rmLabels;
            rChart.data.datasets[0].data = rmValues;
            rChart.data.datasets[0].borderColor = part === '胸' ? '#ff007f' : '#00ffff';
            rChart.update();

            document.getElementById('vol-graph-title').innerText = `${part} VOLUME TREND (${currentFilterPeriod})`;
            document.getElementById('rm-graph-title').innerText = `${part} 1RM TREND (${currentFilterPeriod})`;
        }

        // AIチャット（相談機能モック）
        function sendMessage() {
            const input = document.getElementById('chat-input'); const box = document.getElementById('chat-box');
            if (!input.value.trim()) return;
            box.innerHTML += `<div class="bg-[#0aadc7]/10 border border-[#0aadc7]/30 p-3 rounded-2xl rounded-tr-none max-w-[88%] ml-auto text-right text-white font-medium">${input.value}</div>`;
            input.value = ''; box.scrollTop = box.scrollHeight;
            setTimeout(() => {
                box.innerHTML += `<div class="bg-[#0c0f17] border border-gray-900 p-3.5 rounded-2xl rounded-tl-none max-w-[88%] text-xs"><span class="font-black text-[#0aadc7] block mb-1">AI Coach</span>修正された直近のデータを含め、7部位の現在の週当たりボリュームバランスを解析しました。次回セッションのアドバイスを組み立てます。</div>`;
                box.scrollTop = box.scrollHeight;
            }, 800);
        }

        // 起動処理
        window.onload = () => {
            renderCalendar();
            selectCategory('胸');
            renderSetInputs();
            renderCategorySelector();
            initCharts();
            renderLogList();
        };
    </script>
</body>
</html>
